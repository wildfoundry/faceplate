name: CI

on:
  pull_request:
  push:
    branches: [main, "release/*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install formatters
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-20
          python3 -m pip install --break-system-packages 'meson>=1.1'
      - name: Check C formatting
        run: clang-format-20 -n --Werror src/*.c src/*.h src/*/*.c src/*/*.h tests/*.c tests/*.h
      - name: Check Meson formatting
        run: |
          meson format --recursive --inplace
          git diff --exit-code

  build:
    name: Build and test (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build check jq zlib1g-dev \
            libudev-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgles-dev libpango1.0-dev \
            libfreetype6-dev libfontconfig1-dev libsystemd-dev \
            libdbus-1-dev libseat-dev
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then
            echo 'CC=clang' >> "$GITHUB_ENV"
          else
            echo 'CC=gcc' >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: >-
          meson setup build
          -Ddocs=disabled
          -Dlibseat=enabled
          -Dvideo_fbdev=enabled
          -Dvideo_drm2d=enabled
          -Dvideo_drm3d=enabled
          -Drenderer_gltex=enabled
          -Dfont_freetype=enabled
          -Dfont_pango=enabled
          -Ddbus=enabled
      - name: Compile
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs

  minimal:
    name: Minimal build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build check zlib1g-dev libudev-dev libxkbcommon-dev
      - name: Configure minimal fbdev/PSF build
        run: >-
          meson setup build-minimal
          -Ddocs=disabled
          -Dlibseat=disabled
          -Dvideo_fbdev=enabled
          -Dvideo_drm2d=disabled
          -Dvideo_drm3d=disabled
          -Drenderer_gltex=disabled
          -Dfont_psf=enabled
          -Dfont_unifont=disabled
          -Dfont_freetype=disabled
          -Dfont_pango=disabled
          -Ddbus=disabled
      - run: meson compile -C build-minimal
      - run: meson test -C build-minimal --print-errorlogs
