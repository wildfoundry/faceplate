name: CodeQL

on:
  pull_request:
    branches: [main, "release/*"]
  push:
    branches: [main, "release/*"]
  schedule:
    - cron: "31 3 * * 2"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (c-cpp)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build check jq zlib1g-dev \
            libudev-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgles-dev libpango1.0-dev \
            libfreetype6-dev libfontconfig1-dev libsystemd-dev \
            libdbus-1-dev libseat-dev
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
      - name: Build
        run: |
          meson setup build-codeql -Ddocs=disabled
          meson compile -C build-codeql
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
